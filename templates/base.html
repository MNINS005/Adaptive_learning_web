{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Adaptive Learning{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="brand" href="{% url 'learning:home' %}">Adaptive Learning</a>
            <div class="nav-links">
                <a href="{% url 'questions:list' %}">Questions</a>
                <a href="{% url 'attempts:log' %}">Log Attempt</a>
                <a href="{% url 'users:list' %}">Users</a>
                <a href="{% url 'users:login' %}">Login</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
