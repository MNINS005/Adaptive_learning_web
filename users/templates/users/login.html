{% extends "base.html" %}

{% block title %}Login | Smart Interview Prep{% endblock %}

{% block content %}
<section class="form-page">
    <h1>Login</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p class="form-switch">
        New here?
        <a href="{% url 'users:register' %}">Create an account</a>
    </p>
</section>
{% endblock %}
